    <div x-show="page === 'kanban'" class="page-section">
      <!-- Métricas do pipeline -->
      <div style="display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap">
        <div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px">
          <div style="font-size:22px;font-weight:800" x-text="pipelineCount"></div>
          <div style="font-size:11px;color:var(--mu)">Leads no pipeline</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px">
          <div style="font-size:22px;font-weight:800;color:var(--green)" x-text="fmtBRL(pipelineTotal)"></div>
          <div style="font-size:11px;color:var(--mu)">Valor potencial total</div>
        </div>
        <div style="flex:1;min-width:140px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px">
          <div style="font-size:22px;font-weight:800;color:var(--gold)" x-text="pipelineConversion + '%'"></div>
          <div style="font-size:11px;color:var(--mu)">Taxa de conversão</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="btn" @click="loadKanban()" style="font-size:12px">↺ Atualizar</button>
          <button class="btn btn-green" @click="openNewLeadModal()" style="font-size:12px;white-space:nowrap">+ Novo Lead</button>
        </div>
      </div>
      <div class="kanban-wrap">
        <template x-for="col in kanban" :key="col.id">
          <div class="kanban-col"
            :class="{ 'kanban-drag-over': kanbanDragOver === col.id }"
            @dragover.prevent="kanbanDragOver = col.id"
            @dragleave="kanbanDragOver = null"
            @drop.prevent="kanbanDrop(col.id)">
            <div class="kanban-col-header">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="width:8px;height:8px;border-radius:50%" :style="`background:${col.color}`"></div>
                <span class="kanban-col-title" x-text="col.label"></span>
              </div>
              <span class="kanban-count" x-text="col.items.length"></span>
            </div>
            <div style="font-size:10px;color:var(--mu);margin-bottom:8px" x-show="col.total > 0" x-text="fmtBRL(col.total)"></div>
            <div class="kanban-col-body">
            <template x-for="item in col.items" :key="item.id">
              <div class="kanban-card" draggable="true"
                @dragstart="kanbanDragStart(item.id, col.id)"
                @dragend="kanbanDragOver = null"
                style="cursor:grab">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
                  <div class="kanban-card-name" x-text="item.name"></div>
                  <span class="badge" :class="statusColor(item.status)" style="font-size:9px" x-text="item.status"></span>
                </div>
                <div class="kanban-card-info" x-text="dispPhone(item.phone)"></div>
                <div class="kanban-card-info" style="margin-top:4px" x-text="item.interesse"></div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
                  <div class="kanban-card-val" x-text="item.val"></div>
                  <div style="display:flex;align-items:center;gap:4px">
                    <span x-show="item.auto"
                      style="font-size:9px;background:rgba(56,189,248,.15);color:#38BDF8;border-radius:4px;padding:1px 5px"
                      title="Classificado automaticamente pelos sinais do lead">⚡ Auto</span>
                    <span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;color:#000"
                      :style="`background:${scoreColor(item.ai_score!=null?item.ai_score:item.score||0)}`"
                      x-text="item.ai_score!=null?'⚡'+item.ai_score:item.score||0"></span>
                  </div>
                </div>
                <!-- sugestão de coluna diferente -->
                <div x-show="item.ai_kanban_sugerida && item.ai_kanban_sugerida !== 'novo' && item.ai_kanban_sugerida !== item.kanban_stage"
                  @click.stop="kanbanMoveToSuggested(item.id, item.ai_kanban_sugerida)"
                  style="margin-top:6px;font-size:10px;color:#f97316;cursor:pointer;background:rgba(249,115,22,.08);border-radius:4px;padding:2px 6px"
                  :title="`IA sugere mover para: ${item.ai_kanban_sugerida}`">
                  💡 Sugestão: <span x-text="item.ai_kanban_sugerida"></span>
                </div>
              </div>
            </template>
            <div x-show="col.items.length === 0" style="text-align:center;padding:20px 0;font-size:12px;color:var(--mu2);border:2px dashed var(--border);border-radius:8px;margin-top:4px">
              Arraste leads aqui
            </div>
            </div><!-- /kanban-col-body -->
          </div>
        </template>
      </div>
    </div>
