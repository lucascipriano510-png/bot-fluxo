    <div x-show="page === 'leads'" class="page-section">

      <!-- CRM feedback toast -->
      <div x-show="crmFeedback !== null" x-transition
        :style="`position:fixed;bottom:28px;right:28px;z-index:999;background:${crmFeedback==='ok'?'var(--green)':'#ef4444'};color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.4)`"
        x-text="crmFeedbackMsg"></div>

      <!-- Top metrics -->
      <div class="metrics-row" style="margin-bottom:20px">
        <div class="metric-card"><div class="metric-val" x-text="leads.length"></div><div class="metric-label">Total de leads</div></div>
        <div class="metric-card gold"><div class="metric-val" x-text="leadsQuentes"></div><div class="metric-label">🔥 Quentes</div></div>
        <div class="metric-card blue"><div class="metric-val" x-text="leadsMornos"></div><div class="metric-label">🌡️ Mornos</div></div>
        <div class="metric-card"><div class="metric-val" x-text="leadsFrios"></div><div class="metric-label">🧊 Frios</div></div>
        <button class="btn btn-green" @click="openNewLeadModal()"
          style="align-self:center;font-size:12px;white-space:nowrap">+ Novo Lead</button>
        <button class="btn" @click="analyzeAllLeadsAI()" :disabled="aiAnalyzingAll"
          style="align-self:center;font-size:12px;white-space:nowrap;gap:5px">
          ⚡ <span x-text="aiAnalyzingAll ? 'Analisando...' : 'Analisar todos'"></span>
        </button>
      </div>
      <div x-show="aiStatus" style="font-size:12px;color:var(--green);margin-bottom:10px" x-text="aiStatus"></div>

      <!-- 3-col CRM layout -->
      <div class="crm-shell">

        <!-- Left: lead list -->
        <div class="crm-list">
          <div style="padding:12px 14px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px">
            <input type="text" x-model="crmSearch" placeholder="Buscar nome, telefone, interesse..."
              style="background:var(--card2);border:1px solid var(--border2);border-radius:8px;color:var(--tx);padding:7px 12px;font-size:12px;font-family:var(--font);outline:none;width:100%">
            <!-- Filtro rápido por ESTÁGIO do funil -->
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button @click="crmStageFilter=''" :class="crmStageFilter==='' ? 'btn btn-green' : 'btn btn-ghost'" style="font-size:10px;padding:3px 9px">Todos (<span x-text="leads.length"></span>)</button>
              <template x-for="s in stages" :key="s.id">
                <button @click="crmStageFilter = (crmStageFilter===s.id ? '' : s.id)"
                  :class="crmStageFilter===s.id ? 'btn' : 'btn btn-ghost'"
                  :style="`font-size:10px;padding:3px 9px;${crmStageFilter===s.id?('background:'+s.color+'22;border-color:'+s.color+';color:'+s.color):''}`">
                  <span x-text="s.emoji"></span> <span x-text="s.label"></span> (<span x-text="stageCounts[s.id]"></span>)
                </button>
              </template>
            </div>
            <!-- Filtro rápido por TEMPERATURA -->
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button @click="crmFilter=''" :class="crmFilter==='' ? 'btn btn-green' : 'btn btn-ghost'" style="font-size:10px;padding:3px 9px">Todas</button>
              <button @click="crmFilter='QUENTE'" :class="crmFilter==='QUENTE' ? 'btn' : 'btn btn-ghost'" style="font-size:10px;padding:3px 9px;color:#ef4444">🔥 Quentes</button>
              <button @click="crmFilter='MORNO'" :class="crmFilter==='MORNO' ? 'btn' : 'btn btn-ghost'" style="font-size:10px;padding:3px 9px;color:var(--gold)">🌡️ Mornos</button>
              <button @click="crmFilter='FRIO'" :class="crmFilter==='FRIO' ? 'btn' : 'btn btn-ghost'" style="font-size:10px;padding:3px 9px;color:var(--mu)">🧊 Frios</button>
            </div>
          </div>
          <div style="overflow-y:auto;flex:1">
            <div x-show="crmFilteredLeads.length === 0" style="padding:32px 16px;text-align:center;color:var(--mu);font-size:12px">Nenhum lead encontrado.</div>
            <template x-for="l in crmFilteredLeads" :key="l.id">
              <div class="crm-lead-item" :class="{ selected: crmLead?.id === l.id }" @click="selectCrmLead(l)">
                <div class="conv-avatar" style="width:32px;height:32px;font-size:12px;flex-shrink:0" x-text="(l.nome||l.phone).charAt(0).toUpperCase()"></div>
                <div style="flex:1;min-width:0">
                  <div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="l.nome || dispPhone(l.phone)"></div>
                  <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
                    <span style="font-size:9px;font-weight:700;padding:1px 7px;border-radius:8px;flex-shrink:0"
                      :style="`background:${stageMeta(stageOf(l)).color}22;color:${stageMeta(stageOf(l)).color}`"
                      x-text="stageMeta(stageOf(l)).emoji + ' ' + stageMeta(stageOf(l)).label"></span>
                    <span style="font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="l.interesse || ''"></span>
                  </div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0">
                  <span class="badge"
                    :class="statusColor(l.ai_temperatura ? l.ai_temperatura.toUpperCase() : l.status_comercial)"
                    style="font-size:9px"
                    x-text="l.ai_temperatura ? l.ai_temperatura.toUpperCase() : (l.status_comercial || 'FRIO')"></span>
                  <span x-show="l.ai_score != null"
                    style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;color:#000"
                    :style="`background:${scoreColor(l.ai_score||0)}`"
                    :title="intencaoLabel(l.ai_intencao)">⚡ <span x-text="l.ai_score"></span></span>
                  <span x-show="l.ai_score == null && !l.ai_analisado_em"
                    style="font-size:9px;color:var(--mu);padding:1px 4px" title="Análise pendente">🕐</span>
                  <span x-show="l.ai_score == null && l.ai_analisado_em"
                    style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;color:#000"
                    :style="`background:${scoreColor(l.conversion_score||0)}`"
                    x-text="l.conversion_score || 0"></span>
                  <span style="font-size:10px;color:var(--mu2)" x-text="fmtTime(l.atualizado_em)"></span>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Center: lead editor -->
        <div class="crm-editor">
          <div x-show="!crmLead" style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:13px;text-align:center;padding:40px">
            <div>
              <div style="font-size:32px;margin-bottom:12px">👈</div>
              Selecione um lead para editar
            </div>
          </div>

          <template x-if="crmLead">
            <div style="display:flex;flex-direction:column;height:100%">
              <!-- header -->
              <div style="padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px">
                <!-- Score ring -->
                <div style="position:relative;width:48px;height:48px;flex-shrink:0">
                  <svg viewBox="0 0 36 36" style="width:48px;height:48px;transform:rotate(-90deg)">
                    <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="3"/>
                    <circle cx="18" cy="18" r="15" fill="none" :stroke="scoreColor(crmLead.ai_score ?? crmLead.conversion_score ?? 0)" stroke-width="3"
                      :stroke-dasharray="`${(crmLead.ai_score ?? crmLead.conversion_score ?? 0) * 0.94} 94`" stroke-linecap="round"/>
                  </svg>
                  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700" x-text="crmLead.ai_score ?? crmLead.conversion_score ?? 0"></div>
                </div>
                <div style="flex:1">
                  <div style="font-size:15px;font-weight:700" x-text="crmLead.nome || dispPhone(crmLead.phone)"></div>
                  <div style="font-size:12px;color:var(--mu)" x-text="dispPhone(crmLead.phone)"></div>
                  <div style="font-size:11px;font-weight:600;margin-top:2px"
                    :style="`color:${scoreColor(crmLead.ai_score ?? crmLead.conversion_score ?? 0)}`"
                    x-text="(crmLead.ai_temperatura ?? crmLead.status_comercial ?? 'Frio') + ' · score ' + (crmLead.ai_score ?? crmLead.conversion_score ?? 0)"></div>
                </div>
                <a :href="crmWhatsApp(crmLead.phone)" target="_blank" class="btn btn-green" style="font-size:11px;padding:6px 12px;text-decoration:none;gap:5px">
                  <svg viewBox="0 0 24 24" style="width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.06 6.06l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  WhatsApp
                </a>
              </div>

              <!-- resumo métricas -->
              <div style="display:flex;gap:12px;padding:10px 20px;background:var(--card2);border-bottom:1px solid var(--border)">
                <div style="flex:1;text-align:center">
                  <div style="font-size:16px;font-weight:700;color:var(--gold)" x-text="crmLead.total_purchases || 0"></div>
                  <div style="font-size:10px;color:var(--mu)">Compras</div>
                </div>
                <div style="flex:1;text-align:center">
                  <div style="font-size:16px;font-weight:700;color:var(--green)" x-text="fmtBRL(crmLead.lifetime_value || 0)"></div>
                  <div style="font-size:10px;color:var(--mu)">Total gasto</div>
                </div>
                <div style="flex:1;text-align:center">
                  <div style="font-size:16px;font-weight:700" x-text="crmMessages.length"></div>
                  <div style="font-size:10px;color:var(--mu)">Mensagens</div>
                </div>
              </div>

              <!-- Análise IA -->
              <div style="border-bottom:1px solid var(--border);padding:12px 20px">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
                  <div style="display:flex;align-items:center;gap:8px">
                    <div style="font-size:11px;font-weight:700;color:var(--green);text-transform:uppercase;letter-spacing:.06em">⚡ Análise IA</div>
                    <!-- badge urgência -->
                    <span x-show="crmLead.ai_urgencia==='alta'"
                      style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(239,68,68,.2);color:#ef4444;animation:pulse 1.5s infinite">🔴 Urgente</span>
                    <span x-show="crmLead.ai_urgencia==='media'"
                      style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(250,204,21,.2);color:#facc15">🟡 Normal</span>
                    <span x-show="crmLead.ai_urgencia==='baixa'"
                      style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(107,114,128,.15);color:#9ca3af">⚪ Baixa</span>
                  </div>
                  <button class="btn" style="font-size:10px;padding:2px 8px"
                    @click="analyzeLeadAI(crmLead.id)" :disabled="aiAnalyzing"
                    x-text="aiAnalyzing ? 'Analisando...' : 'Re-analisar'"></button>
                </div>

                <!-- pendente -->
                <div x-show="!crmLead.ai_analisado_em"
                  style="font-size:12px;color:var(--mu);display:flex;align-items:center;gap:6px">
                  🕐 Nenhuma análise ainda.
                  <button class="btn btn-green" style="font-size:10px;padding:2px 8px"
                    @click="analyzeLeadAI(crmLead.id)" :disabled="aiAnalyzing">Analisar agora</button>
                </div>

                <!-- resultado -->
                <div x-show="crmLead.ai_analisado_em" style="display:flex;flex-direction:column;gap:8px">

                  <!-- resumo -->
                  <div x-show="crmLead.ai_resumo" style="font-size:12px;color:var(--tx);line-height:1.5" x-text="crmLead.ai_resumo"></div>

                  <!-- próxima ação -->
                  <div x-show="crmLead.ai_proxima_acao"
                    style="background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.25);border-radius:8px;padding:8px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
                    <div style="font-size:12px;color:var(--green);line-height:1.4" x-text="crmLead.ai_proxima_acao"></div>
                    <button class="btn" style="font-size:10px;padding:2px 8px;flex-shrink:0"
                      @click="navigator.clipboard.writeText(crmLead.ai_proxima_acao)">Copiar</button>
                  </div>

                  <!-- intenção + confiança -->
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                    <span style="font-size:11px;background:var(--card2);border-radius:6px;padding:2px 8px"
                      x-text="intencaoLabel(crmLead.ai_intencao)"></span>
                    <div style="flex:1;height:4px;background:var(--border);border-radius:2px;min-width:60px">
                      <div style="height:100%;background:var(--green);border-radius:2px;transition:width .3s"
                        :style="`width:${Math.round((crmLead.ai_confianca||0)*100)}%`"></div>
                    </div>
                    <span style="font-size:10px;color:var(--mu)" x-text="`${Math.round((crmLead.ai_confianca||0)*100)}% confiança`"></span>
                  </div>
                </div>
              </div>

              <!-- form -->
              <div style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px">
                <div class="crm-row2">
                  <div class="field"><label>Nome</label><input type="text" x-model="crmLead.nome" placeholder="Nome do cliente"></div>
                  <div class="field"><label>Interesse</label><input type="text" x-model="crmLead.interesse" placeholder="Produto ou serviço"></div>
                </div>
                <div class="crm-row3">
                  <div class="field">
                    <label>Status comercial</label>
                    <select x-model="crmLead.status_comercial">
                      <option value="QUENTE">🔥 QUENTE</option>
                      <option value="MORNO">🌡️ MORNO</option>
                      <option value="FRIO">🧊 FRIO</option>
                    </select>
                  </div>
                  <div class="field"><label>Valor potencial (R$)</label><input type="number" x-model="crmLead.valor_potencial" placeholder="0"></div>
                  <div class="field"><label>Cidade</label><input type="text" x-model="crmLead.cidade" placeholder="Cidade"></div>
                </div>
                <div class="crm-row3">
                  <div class="field"><label>Variação</label><input type="text" x-model="crmLead.tamanho" placeholder="Tamanho, plano, nível..."></div>
                  <div class="field"><label>Tipo/estilo</label><input type="text" x-model="crmLead.estilo" placeholder="Ex: básico, premium, urgente..."></div>
                  <div class="field"><label>Origem</label><input type="text" x-model="crmLead.origem" placeholder="Instagram, WhatsApp..."></div>
                </div>
                <div class="field"><label>Próxima ação</label><input type="text" x-model="crmLead.proxima_acao" placeholder="O que fazer com esse lead?"></div>
                <div class="field"><label>Notas internas</label><textarea x-model="crmLead.notes" rows="4" placeholder="Observações, histórico de contato, preferências..."></textarea></div>
              </div>

              <!-- save bar -->
              <div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px">
                <div style="display:flex;gap:8px;flex-wrap:wrap" x-show="crmLead && crmLead.status !== 'concluido'">
                  <button class="btn btn-green" style="flex:1;justify-content:center;font-size:12px" @click="convertLead(crmLead.id)">✅ Convertido</button>
                  <button class="btn" style="flex:1;justify-content:center;font-size:12px;background:rgba(239,68,68,.15);color:#ef4444;border-color:#ef4444" @click="loseLead(crmLead.id)">❌ Perdido</button>
                  <button class="btn btn-ghost" style="flex:1;justify-content:center;font-size:12px" @click="addNoteLead(crmLead.id)" x-show="crmLead">📝 Nota</button>
                </div>
                <div style="display:flex;justify-content:flex-end">
                  <button class="btn btn-green" style="padding:10px 28px;font-weight:700" @click="saveCrmLead()" :disabled="crmSaving">
                    <span x-text="crmSaving ? 'Salvando...' : 'Salvar alterações'"></span>
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Right: timeline / mensagens / compras -->
        <div class="crm-history">
          <!-- abas -->
          <div style="padding:10px 12px;border-bottom:1px solid var(--border);display:flex;gap:4px">
            <button @click="crmHistoryTab='cerco'" :class="crmHistoryTab==='cerco'?'btn btn-green':'btn btn-ghost'" style="font-size:10px;padding:4px 10px;flex:1">🎯 Cerco</button>
            <button @click="crmHistoryTab='timeline'" :class="crmHistoryTab==='timeline'?'btn btn-green':'btn btn-ghost'" style="font-size:10px;padding:4px 10px;flex:1">Timeline</button>
            <button @click="crmHistoryTab='messages'" :class="crmHistoryTab==='messages'?'btn btn-green':'btn btn-ghost'" style="font-size:10px;padding:4px 10px;flex:1">Mensagens</button>
            <button @click="crmHistoryTab='purchases'" :class="crmHistoryTab==='purchases'?'btn btn-green':'btn btn-ghost'" style="font-size:10px;padding:4px 10px;flex:1">Compras</button>
          </div>

          <!-- 🎯 CERCO — dossiê do que o site sabe sobre o lead -->
          <div x-show="crmHistoryTab==='cerco'" style="flex:1;overflow-y:auto;padding:14px">
            <div x-show="!crmLead" style="text-align:center;padding:32px 0;color:var(--mu);font-size:12px">Selecione um lead.</div>
            <div x-show="crmLead && crmDossieLoading" style="text-align:center;padding:24px 0;color:var(--mu);font-size:12px">Montando o cerco…</div>
            <div x-show="crmLead && !crmDossieLoading && (!crmDossie || !crmDossie.temSinais)" style="text-align:center;padding:32px 0;color:var(--mu);font-size:12px">Sem sinais do site pra este lead ainda.</div>

            <template x-if="crmLead && !crmDossieLoading && crmDossie && crmDossie.temSinais">
              <div style="display:flex;flex-direction:column;gap:12px">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--border2)" x-text="crmDossie.situacaoLabel"></span>
                  <span class="badge" :class="statusColor(crmDossie.calor)" style="font-size:9px" x-text="crmDossie.calor"></span>
                  <span style="font-size:10px;color:var(--mu)" x-text="crmDossie.totalSinais + ' sinais'"></span>
                </div>

                <template x-if="crmDossie.objetoDesejo">
                  <div style="background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:12px">
                    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:4px">Objeto de desejo</div>
                    <div style="font-size:14px;font-weight:700;color:var(--tx)" x-text="crmDossie.objetoDesejo.label"></div>
                    <div x-show="crmDossie.objetoDesejo.price" style="font-size:12px;color:var(--green);font-weight:600;margin-top:2px" x-text="fmtBRL(crmDossie.objetoDesejo.price||0)"></div>
                  </div>
                </template>

                <div style="background:var(--card2);border:1px solid var(--green);border-radius:10px;padding:12px">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green)">Mensagem pronta</div>
                    <button class="btn btn-green" style="font-size:10px;padding:3px 10px" @click="copyDossieMsg()">Copiar</button>
                  </div>
                  <div style="font-size:12px;color:var(--tx);line-height:1.5;white-space:pre-wrap" x-text="crmDossie.mensagemPronta"></div>
                  <a x-show="crmLead && crmLead.phone" :href="crmWhatsApp(crmLead.phone)" target="_blank" class="btn" style="margin-top:8px;font-size:10px;padding:5px 10px;text-decoration:none;gap:5px;width:100%;justify-content:center">Abrir no WhatsApp →</a>
                </div>

                <template x-if="crmDossie.interesses && crmDossie.interesses.length">
                  <div>
                    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:6px">Também olhou</div>
                    <template x-for="(it, i) in crmDossie.interesses" :key="i">
                      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)">
                        <span style="font-size:12px;color:var(--tx)" x-text="it.label"></span>
                        <span x-show="it.price" style="font-size:11px;color:var(--mu)" x-text="fmtBRL(it.price||0)"></span>
                      </div>
                    </template>
                  </div>
                </template>

                <template x-if="crmDossie.timeline && crmDossie.timeline.length">
                  <div>
                    <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin-bottom:6px">No site</div>
                    <template x-for="(ev, i) in crmDossie.timeline" :key="i">
                      <div style="display:flex;gap:8px;padding:5px 0">
                        <span style="font-size:14px" x-text="ev.icon"></span>
                        <div style="flex:1">
                          <span style="font-size:12px;color:var(--tx)" x-text="ev.label"></span>
                          <span x-show="ev.detail" style="font-size:11px;color:var(--mu)" x-text="' · ' + ev.detail"></span>
                          <div style="font-size:10px;color:var(--mu2)" x-text="fmtTime(ev.at)"></div>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>

          <!-- Timeline -->
          <div x-show="crmHistoryTab==='timeline'" style="flex:1;overflow-y:auto;padding:14px">
            <div x-show="!crmLead" style="text-align:center;padding:32px 0;color:var(--mu);font-size:12px">Selecione um lead.</div>
            <div x-show="crmLead && crmTimeline.length === 0" style="text-align:center;padding:32px 0;color:var(--mu);font-size:12px">Sem eventos.</div>
            <template x-for="(ev, i) in crmTimeline" :key="i">
              <div style="display:flex;gap:10px;padding:8px 0">
                <div style="font-size:18px;flex-shrink:0" x-text="ev.icon"></div>
                <div style="flex:1;border-left:2px solid var(--border);padding-left:10px;padding-bottom:6px">
                  <div style="font-size:12px;font-weight:600" x-text="ev.title"></div>
                  <div x-show="ev.detail" style="font-size:11px;color:var(--mu)" x-text="ev.detail"></div>
                  <div style="font-size:10px;color:var(--mu2);margin-top:2px" x-text="fmtTime(ev.at)"></div>
                </div>
              </div>
            </template>
          </div>

          <!-- Mensagens -->
          <div x-show="crmHistoryTab==='messages'" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px">
            <div x-show="!crmLead" style="text-align:center;padding:32px 0;color:var(--mu);font-size:12px">Selecione um lead.</div>
            <div x-show="crmLead && crmMessages.length === 0" style="text-align:center;padding:32px 0;color:var(--mu);font-size:12px">Sem mensagens registradas.</div>
            <template x-for="(m, i) in crmMessages" :key="i">
              <div :class="m.from === 'bot' ? 'bubble bubble-bot' : 'bubble bubble-user'" style="font-size:12px;max-width:90%">
                <span style="white-space:pre-wrap" x-text="m.text"></span>
                <div class="bubble-time" x-text="m.time"></div>
              </div>
            </template>
          </div>

          <!-- Compras -->
          <div x-show="crmHistoryTab==='purchases'" style="flex:1;overflow-y:auto;padding:14px">
            <button class="btn btn-green" style="width:100%;justify-content:center;font-size:11px;margin-bottom:10px" @click="addPurchase(crmLead.id)" x-show="crmLead">+ Registrar compra</button>
            <div x-show="crmLead && crmPurchases.length === 0" style="text-align:center;padding:24px 0;color:var(--mu);font-size:12px">Nenhuma compra registrada.</div>
            <template x-for="(p, i) in crmPurchases" :key="i">
              <div style="background:var(--card2);border-radius:8px;padding:10px;margin-bottom:8px">
                <div style="display:flex;justify-content:space-between;align-items:center">
                  <div style="font-size:12px;font-weight:600" x-text="p.produto || 'Produto'"></div>
                  <div style="font-size:12px;font-weight:700;color:var(--green)" x-text="fmtBRL(p.valor || 0)"></div>
                </div>
                <div style="font-size:10px;color:var(--mu);margin-top:2px" x-text="fmtTime(p.data_compra)"></div>
              </div>
            </template>
          </div>
        </div>

      </div>
    </div>
