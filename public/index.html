<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BOT FLUXO — CMD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #00ff41;
      --green-glow:   rgba(0, 255, 65, 0.15);
      --green-border: rgba(0, 255, 65, 0.25);
      --green-dim:    rgba(0, 255, 65, 0.06);
      --bg:           #000000;
      --card:         #080808;
      --card-hover:   #0e0e0e;
      --border:       #161616;
      --border-mid:   #222222;
      --text:         #f0f0f0;
      --muted:        #444444;
      --dim:          #222222;
      --red:          #ff3c3c;
      --yellow:       #ffaa00;
      --font:         'Space Mono', 'Courier New', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    .header {
      position: sticky;
      top: 0;
      z-index: 200;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green), 0 0 16px rgba(0,255,65,0.4);
      flex-shrink: 0;
      animation: blink 3s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0.2; }
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--green);
      text-transform: uppercase;
    }

    .brand-sep {
      color: var(--dim);
      font-weight: 400;
    }

    .header-stats {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .stat {
      text-align: right;
      line-height: 1.3;
    }

    .stat-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--green);
      letter-spacing: 0.05em;
    }

    .stat-label {
      font-size: 8px;
      letter-spacing: 0.15em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── TABS ───────────────────────────────────────────────── */
    .tabs {
      position: sticky;
      top: 52px;
      z-index: 199;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
    }

    .tab-btn {
      flex: 1;
      padding: 13px 8px;
      font-family: var(--font);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      position: relative;
    }

    .tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .tab-badge {
      position: absolute;
      top: 8px;
      right: calc(50% - 22px);
      background: var(--green);
      color: #000;
      font-size: 8px;
      font-weight: 700;
      padding: 1px 4px;
      border-radius: 2px;
      min-width: 16px;
      text-align: center;
    }

    /* ── CONTENT ────────────────────────────────────────────── */
    .content {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px 100px;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ── SECTION LABEL ──────────────────────────────────────── */
    .section-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── CARDS ──────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 14px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
      overflow: hidden;
    }

    .card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--green);
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover {
      background: var(--card-hover);
      border-color: var(--border-mid);
    }

    .card:hover::after { opacity: 1; }

    .card-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-phone {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--text);
      word-break: break-all;
    }

    /* ── BADGES ─────────────────────────────────────────────── */
    .badge {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 3px 7px;
      border-radius: 2px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .badge-on   { background: var(--green-dim);           color: var(--green);   border: 1px solid var(--green-border); }
    .badge-off  { background: transparent;                 color: var(--muted);   border: 1px solid var(--border); }
    .badge-lead { background: rgba(255,170,0,0.08);        color: var(--yellow);  border: 1px solid rgba(255,170,0,0.25); }
    .badge-done { background: rgba(0,255,65,0.05);         color: #00cc33;        border: 1px solid rgba(0,255,65,0.12); }
    .badge-enc  { background: rgba(0,120,255,0.08);        color: #4da6ff;        border: 1px solid rgba(0,120,255,0.2); }

    .card-node {
      font-size: 10px;
      color: var(--green);
      letter-spacing: 0.08em;
      margin-bottom: 5px;
      font-style: italic;
    }

    .card-info {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-time { font-size: 9px; color: var(--dim); letter-spacing: 0.05em; }
    .card-cta  { font-size: 9px; color: var(--green); letter-spacing: 0.12em; text-transform: uppercase; }

    /* ── MESSAGES ───────────────────────────────────────────── */
    .msg-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-back {
      font-family: var(--font);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--border-mid);
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 2px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-back:hover { color: var(--text); border-color: #333; }

    .msg-header-phone {
      font-size: 12px;
      font-weight: 700;
      color: var(--green);
      word-break: break-all;
    }

    .msg-list { display: flex; flex-direction: column; gap: 10px; }

    .msg { display: flex; align-items: flex-start; gap: 10px; }

    .msg-arrow {
      font-size: 11px;
      color: var(--muted);
      min-width: 14px;
      flex-shrink: 0;
      margin-top: 8px;
    }

    .msg.entrada .msg-arrow { color: var(--green); }

    .msg-wrap { flex: 1; min-width: 0; }

    .msg-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 9px 11px;
      font-size: 11px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.entrada .msg-bubble {
      border-left: 2px solid var(--green);
      background: var(--green-dim);
    }

    .msg-meta {
      font-size: 9px;
      color: var(--dim);
      margin-top: 4px;
      letter-spacing: 0.05em;
    }

    /* ── TEST PANEL ─────────────────────────────────────────── */
    .form-group { margin-bottom: 12px; }

    .field-label {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border-mid);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      padding: 11px 13px;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
    }

    .input:focus { border-color: var(--green-border); }
    .input::placeholder { color: var(--dim); }

    .btn-row { display: flex; gap: 8px; margin-top: 4px; }

    .btn {
      font-family: var(--font);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 11px 16px;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-send {
      flex: 1;
      background: var(--green);
      color: #000;
    }

    .btn-send:hover { background: #00e63a; }
    .btn-send:active { transform: scale(0.98); }
    .btn-send:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border-mid);
      color: var(--muted);
    }

    .btn-ghost:hover { border-color: #333; color: var(--text); }

    /* ── RESPONSE ───────────────────────────────────────────── */
    .response-box {
      background: var(--card);
      border: 1px solid var(--green-border);
      border-radius: 3px;
      padding: 16px;
      margin-top: 16px;
      display: none;
    }

    .response-box.visible { display: block; }

    .response-title {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--green);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .response-text {
      font-size: 12px;
      color: var(--text);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
    }

    .response-node {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.08em;
      font-style: italic;
    }

    /* ── ERROR BANNER ───────────────────────────────────────── */
    .error-banner {
      background: rgba(255,60,60,0.06);
      border: 1px solid rgba(255,60,60,0.25);
      border-radius: 2px;
      padding: 10px 14px;
      font-size: 10px;
      color: var(--red);
      letter-spacing: 0.04em;
      line-height: 1.5;
      margin-bottom: 14px;
      display: none;
    }

    .error-banner.visible { display: block; }

    /* ── EMPTY ──────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1.8;
    }

    /* ── REFRESH DOT ────────────────────────────────────────── */
    .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      margin-left: 6px;
      vertical-align: middle;
      opacity: 0;
      transition: opacity 0.1s;
    }

    .dot.flash { opacity: 1; }

    /* ── DIVIDER ────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── SCROLLBAR ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-mid); border-radius: 2px; }
  </style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────── -->
<header class="header">
  <div class="brand">
    <div class="led"></div>
    <div class="brand-name">Bot Fluxo <span class="brand-sep">/</span> CMD</div>
  </div>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-val" id="h-sessions">—</div>
      <div class="stat-label">Sessões</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="h-leads">—</div>
      <div class="stat-label">Leads</div>
    </div>
  </div>
</header>

<!-- ── TABS ────────────────────────────────────────────────── -->
<nav class="tabs">
  <button class="tab-btn active" id="tab-sessions" onclick="switchTab('sessions')">
    Sessões
    <span class="tab-badge" id="badge-sessions" style="display:none"></span>
  </button>
  <button class="tab-btn" id="tab-leads" onclick="switchTab('leads')">Leads</button>
  <button class="tab-btn" id="tab-test" onclick="switchTab('test')">Testar</button>
</nav>

<!-- ── CONTENT ─────────────────────────────────────────────── -->
<main class="content">
  <div class="error-banner" id="err"></div>

  <!-- SESSIONS -->
  <div class="panel active" id="panel-sessions">
    <div class="section-label">
      Sessões ativas
      <span class="dot" id="refresh-dot"></span>
    </div>
    <div id="sessions-list"><div class="empty">Carregando...</div></div>
  </div>

  <!-- MESSAGES (inside sessions) -->
  <div class="panel" id="panel-messages">
    <div class="msg-header">
      <button class="btn-back" onclick="backToSessions()">← Voltar</button>
      <div class="msg-header-phone" id="msg-phone-label"></div>
    </div>
    <div class="msg-list" id="msg-list">
      <div class="empty">Carregando...</div>
    </div>
  </div>

  <!-- LEADS -->
  <div class="panel" id="panel-leads">
    <div class="section-label">Leads qualificados</div>
    <div id="leads-list"><div class="empty">Carregando...</div></div>
  </div>

  <!-- TEST -->
  <div class="panel" id="panel-test">
    <div class="section-label">Simulador de conversa</div>

    <div class="form-group">
      <div class="field-label">Telefone (com DDI)</div>
      <input class="input" id="t-phone" type="tel" placeholder="5534900000000" value="5534900000000">
    </div>

    <div class="form-group">
      <div class="field-label">Mensagem</div>
      <input class="input" id="t-msg" type="text" placeholder="Digite aqui..."
        onkeydown="if(event.key==='Enter')sendTest()">
    </div>

    <div class="btn-row">
      <button class="btn btn-send" id="btn-send" onclick="sendTest()">Enviar</button>
      <button class="btn btn-ghost" onclick="resetTest()">Reset sessão</button>
    </div>

    <div class="response-box" id="res-box">
      <div class="response-title">Resposta do bot</div>
      <div class="response-text" id="res-text"></div>
      <div class="response-node" id="res-node"></div>
    </div>
  </div>
</main>

<script>
  // ── Estado ────────────────────────────────────────────────
  let currentTab = 'sessions';

  // ── Utilitários ───────────────────────────────────────────
  const $ = id => document.getElementById(id);

  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function ago(iso) {
    if (!iso) return '—';
    const s = Math.floor((Date.now() - new Date(iso)) / 1000);
    if (s < 60) return `${s}s atrás`;
    if (s < 3600) return `${Math.floor(s/60)}min atrás`;
    if (s < 86400) return `${Math.floor(s/3600)}h atrás`;
    return `${Math.floor(s/86400)}d atrás`;
  }

  function hhmm(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  function isOnline(iso) {
    return iso && (Date.now() - new Date(iso)) < 300000;
  }

  function setError(msg) {
    const el = $('err');
    if (msg) { el.textContent = '⚠  ' + msg; el.classList.add('visible'); }
    else el.classList.remove('visible');
  }

  function flash() {
    const d = $('refresh-dot');
    d.classList.add('flash');
    setTimeout(() => d.classList.remove('flash'), 400);
  }

  // ── Tabs ──────────────────────────────────────────────────
  function switchTab(tab) {
    ['sessions', 'leads', 'test'].forEach(t => {
      $('tab-' + t).classList.toggle('active', t === tab);
      $('panel-' + t).classList.toggle('active', t === tab);
    });
    currentTab = tab;
    if (tab === 'leads') loadLeads();
  }

  // ── Sessions ──────────────────────────────────────────────
  async function loadSessions() {
    try {
      const r = await fetch('/api/sessions');
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'Supabase indisponível');

      setError(null);
      const sessions = j.data || [];

      $('h-sessions').textContent = sessions.length;

      const badge = $('badge-sessions');
      const online = sessions.filter(s => isOnline(s.atualizado_em)).length;
      if (online > 0) {
        badge.textContent = online;
        badge.style.display = 'inline-block';
      } else {
        badge.style.display = 'none';
      }

      const list = $('sessions-list');

      if (!sessions.length) {
        list.innerHTML = '<div class="empty">Nenhuma sessão ainda.<br>Teste o bot na aba Testar.</div>';
        return;
      }

      list.innerHTML = sessions.map(s => {
        const ctx = s.context || {};
        const online = isOnline(s.atualizado_em);
        const info = [ctx.nome, ctx.interesse ? `int: ${ctx.interesse}` : null].filter(Boolean).join(' · ');
        return `
          <div class="card" onclick="viewMessages('${esc(s.phone)}')">
            <div class="card-row">
              <div class="card-phone">${esc(s.phone)}</div>
              <span class="badge ${online ? 'badge-on' : 'badge-off'}">${online ? '● on' : '● off'}</span>
            </div>
            <div class="card-node">⌗ ${esc(s.current_node)}</div>
            ${info ? `<div class="card-info">${esc(info)}</div>` : ''}
            <div class="card-footer">
              <div class="card-time">${ago(s.atualizado_em)}</div>
              <div class="card-cta">ver msgs →</div>
            </div>
          </div>`;
      }).join('');

      flash();
    } catch (err) {
      console.error('[sessions]', err);
      setError(err.message);
    }
  }

  // ── Messages ──────────────────────────────────────────────
  async function viewMessages(phone) {
    $('panel-sessions').classList.remove('active');
    $('panel-messages').classList.add('active');
    $('msg-phone-label').textContent = phone;
    $('msg-list').innerHTML = '<div class="empty">Carregando...</div>';

    try {
      const r = await fetch('/api/messages/' + encodeURIComponent(phone));
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);

      const msgs = j.data || [];
      if (!msgs.length) {
        $('msg-list').innerHTML = '<div class="empty">Nenhuma mensagem registrada.</div>';
        return;
      }

      $('msg-list').innerHTML = msgs.map(m => `
        <div class="msg ${esc(m.direcao)}">
          <div class="msg-arrow">${m.direcao === 'entrada' ? '→' : '←'}</div>
          <div class="msg-wrap">
            <div class="msg-bubble">${esc(m.conteudo)}</div>
            <div class="msg-meta">${hhmm(m.criado_em)}${m.node ? ' · ' + esc(m.node) : ''}</div>
          </div>
        </div>`).join('');
    } catch (err) {
      console.error('[messages]', err);
      $('msg-list').innerHTML = '<div class="empty" style="color:var(--red)">Erro ao carregar mensagens.<br>' + esc(err.message) + '</div>';
    }
  }

  function backToSessions() {
    $('panel-messages').classList.remove('active');
    $('panel-sessions').classList.add('active');
  }

  // ── Leads ─────────────────────────────────────────────────
  async function loadLeads() {
    try {
      const r = await fetch('/api/leads');
      const j = await r.json();
      if (!j.ok) throw new Error(j.error);

      const leads = j.data || [];
      $('h-leads').textContent = leads.length;

      const list = $('leads-list');
      if (!leads.length) {
        list.innerHTML = '<div class="empty">Nenhum lead qualificado ainda.</div>';
        return;
      }

      const badgeMap = {
        novo:        'badge-off',
        qualificado: 'badge-lead',
        encaminhado: 'badge-enc',
        concluido:   'badge-done',
      };

      list.innerHTML = leads.map(l => `
        <div class="card">
          <div class="card-row">
            <div class="card-phone">${esc(l.nome || l.phone)}</div>
            <span class="badge ${badgeMap[l.status] || 'badge-off'}">${esc(l.status)}</span>
          </div>
          ${l.nome ? `<div class="card-node">${esc(l.phone)}</div>` : ''}
          ${l.interesse ? `<div class="card-info">Interesse: ${esc(l.interesse)}</div>` : ''}
          <div class="card-footer">
            <div class="card-time">${ago(l.qualificado_em)}</div>
            ${l.valor_potencial ? `<div class="card-cta">R$ ${Number(l.valor_potencial).toFixed(2)}</div>` : ''}
          </div>
        </div>`).join('');
    } catch (err) {
      console.error('[leads]', err);
      setError(err.message);
    }
  }

  // ── Simulador ─────────────────────────────────────────────
  async function sendTest() {
    const phone = $('t-phone').value.trim();
    const text  = $('t-msg').value.trim();
    if (!phone || !text) return;

    const btn = $('btn-send');
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const r = await fetch('/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, text }),
      });
      const j = await r.json();

      $('res-text').textContent = j.ok ? j.reply : ('Erro: ' + (j.error || 'desconhecido'));
      $('res-node').textContent = j.nextNode ? '→ próximo nó: ' + j.nextNode : '';
      $('res-box').classList.add('visible');
      $('t-msg').value = '';
      $('t-msg').focus();
    } catch (err) {
      $('res-text').textContent = 'Erro de rede: ' + err.message;
      $('res-box').classList.add('visible');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Enviar';
    }
  }

  async function resetTest() {
    const phone = $('t-phone').value.trim();
    if (!phone) return;

    try {
      await fetch('/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone }),
      });
      $('res-box').classList.remove('visible');
      $('t-msg').value = '';
      $('t-msg').focus();
    } catch (err) {
      console.error('[reset]', err);
    }
  }

  // ── Inicialização e polling ───────────────────────────────
  loadSessions();

  // Carrega lead count no header
  fetch('/api/leads').then(r => r.json()).then(j => {
    if (j.ok) $('h-leads').textContent = (j.data || []).length;
  }).catch(() => {});

  setInterval(() => {
    if (currentTab === 'sessions') loadSessions();
    if (currentTab === 'leads') loadLeads();
  }, 5000);
</script>
</body>
</html>
